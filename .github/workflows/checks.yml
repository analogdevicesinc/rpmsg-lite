name: Checks

on:
  workflow_call:
    inputs:
      base:
        description: "Commit to compare against, defaults to the PR base"
        required: false
        type: string
        default: ""
      sarif:
        description: >-
          Upload the clang-format results to code scanning. The calling job
          must then grant "security-events: write".
        required: false
        type: boolean
        default: false

jobs:
  checks:
    # Provides clang and clang-format-16
    runs-on: ubuntu-24.04
    # No permissions here: the job gets those of the calling job, and a called
    # workflow can't raise them. It needs "contents: read", and for the sarif
    # input "security-events: write" (plus "actions: read" in a private
    # repository).

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck libnewlib-dev

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ci_dir="$RUNNER_TEMP/ci"
          mkdir -p "$ci_dir"
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -o "$ci_dir/build.sh" \
            https://raw.githubusercontent.com/analogdevicesinc/rpmsg-lite/refs/heads/ci/ci/build.sh
          echo "sh_source=$ci_dir/build.sh" >> "$GITHUB_ENV"

      - name: Prepare env
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}"; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Base: $BASE"
          echo "base=$BASE" >> "$GITHUB_ENV"

      - name: clang-format
        id: clang-format
        if: ${{ !cancelled() }}
        env:
          # The token of a pull request from a fork can't upload the results,
          # the changes are then annotated by the check itself
          SARIF: >-
            ${{ inputs.sarif &&
            (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository) &&
            format('{0}/clang-format.sarif', runner.temp) || '' }}
        run: |
          # shellcheck source=/dev/null
          source "$sh_source"
          rc=0
          check_clang_format "$base" "$SARIF" || rc=$?
          if [[ -n "$SARIF" && -s "$SARIF" ]]; then
            echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Upload clang-format results
        if: ${{ !cancelled() && steps.clang-format.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.clang-format.outputs.sarif }}
          category: clang-format

      - name: Compile
        if: ${{ !cancelled() }}
        run: |
          # shellcheck source=/dev/null
          source "$sh_source"
          check_compile

      - name: Clang static analyzer
        if: ${{ !cancelled() }}
        run: |
          # shellcheck source=/dev/null
          source "$sh_source"
          check_analyzer

      - name: cppcheck
        if: ${{ !cancelled() }}
        run: |
          # shellcheck source=/dev/null
          source "$sh_source"
          check_cppcheck "$base"
