name: ADI CI

on:
  pull_request:
  push:
    branches: [adi-main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      # For the clang-format results that checks.yml uploads to code scanning
      security-events: write
      # Only needed for the upload in a private repository
      actions: read
    uses: analogdevicesinc/rpmsg-lite/.github/workflows/checks.yml@ci
    with:
      sarif: true
